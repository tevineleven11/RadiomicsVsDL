# Builds the Windows executable from run_pipeline.py, checks that it gives the same output
# as running the Python source, and attaches it to the GitHub release.
#
# Runs when a release is published, or manually from the Actions tab ("Run workflow").

name: Build Windows executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the zip to the release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned packages and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run the pipeline from source
        run: python run_pipeline.py > output_source.txt

      - name: Build the executable
        run: pyinstaller --onefile --name RadiomicsVsDL --hidden-import matplotlib.backends.backend_tkagg run_pipeline.py

      - name: Run the executable on a copy of the data
        run: |
          copy dist\RadiomicsVsDL.exe RadiomicsVsDL.exe
          rmdir /s /q figures
          RadiomicsVsDL.exe < NUL > output_exe.txt
          if errorlevel 1 exit /b 1

      - name: Check that both runs give the same output
        shell: python
        run: |
          def lines(path):
              text = open(path, encoding="utf-8").read().splitlines()
              return [l for l in text if l.strip() and "Press Enter" not in l]
          source, exe = lines("output_source.txt"), lines("output_exe.txt")
          if source != exe:
              import difflib
              print("\n".join(difflib.unified_diff(source, exe, "source", "exe", lineterm="")))
              raise SystemExit("The executable's output differs from the Python source.")
          print(f"Identical output ({len(exe)} lines). Last line: {exe[-1]}")

      - name: Package the executable with its data
        run: |
          mkdir package\RadiomicsVsDL
          copy RadiomicsVsDL.exe package\RadiomicsVsDL\
          copy final_dataset_manifest.csv package\RadiomicsVsDL\
          copy fold_splits.pkl package\RadiomicsVsDL\
          copy README.md package\RadiomicsVsDL\
          copy USER_MANUAL.md package\RadiomicsVsDL\
          if exist LICENSE copy LICENSE package\RadiomicsVsDL\
          xcopy /e /i /q results package\RadiomicsVsDL\results
          xcopy /e /i /q preprocessed package\RadiomicsVsDL\preprocessed
          cd package && 7z a -tzip ..\RadiomicsVsDL-windows.zip RadiomicsVsDL > NUL

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadiomicsVsDL-windows
          path: RadiomicsVsDL-windows.zip

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" RadiomicsVsDL-windows.zip --clobber
